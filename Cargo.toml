[package]
name = "niumside-poptracker"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = "0.3.23"
tracing = "0.1.44"
config = "0.15.25"
url = { version = "2.5.8", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
serde_with = { version = "3.21.0", features = ["chrono"], optional = true }
chrono = "0.4.38"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"], optional = true }
thiserror = "2.0.19"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"], optional = true }
metrics = { version = "0.24.6", optional = true }
rocket = { version = "0.5.1", features = ["json"], optional = true }
utoipa = { version = "5.5.0", features = ["rocket_extras", "chrono"], optional = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["rocket"], optional = true }
poise = { version = "0.6.2", optional = true }
strum = { version = "0.28.0", features = ["derive"], optional = true }
anyhow = "1.0.104"
num_enum = { version = "0.7.6", optional = true }
reqwest = { version = "0.13.4", features = ["json"], optional = true }
google-calendar3 = { version = "7.0.0", features = ["yup-oauth2-service-account"], optional = true }
regex = "1.13.1"
ezsockets = { version = "0.7.2", features = ["rustls"], optional = true }
async-trait = "0.1.91"
syn = "3.0.3"
quote = "1.0.47"
futures = "0.3.33"
rustls = { version = "0.23.43", features = ["ring"], optional = true }

[features]
default = ["discord", "monitoring"]
discord = ["dep:poise", "dep:serde_json", "dep:google-calendar3", "dep:rustls", "database"]
database = ["dep:sqlx"]
monitoring = ["api", "dep:metrics-exporter-prometheus", "dep:metrics"]
api = ["dep:utoipa", "dep:utoipa-swagger-ui", "dep:rocket", "dep:serde_json"]
census = ["dep:serde_json", "dep:reqwest", "database", "dep:serde_with", "dep:num_enum", "dep:ezsockets", "dep:strum"]
census_api = ["dep:reqwest"]


[lib]
proc-macro = true
